[build-system]
requires = ["uv_build>=0.12.15,<0.13"]
build-backend = "uv_build"

[project]
name = "pytest-qgis"
version = "4.1.1.post1"
authors = [
  { name = "Gispo Ltd.", email = "info@gispo.fi" },
  { name = "OSGeo Suomi", email = "info@osgeo.fi" },
]
maintainers = [{ name = "OSGeo Suomi", email = "info@osgeo.fi" }]

description = "A pytest plugin for testing QGIS python plugins"
readme = "README.md"

keywords = ["pytest", "qgis", "QGIS", "PyQGIS"]

requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Testing",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: OS Independent",
]
dependencies = ["pytest >= 6.0"]

[project.urls]
homepage = "https://github.com/osgeosuomi/pytest-qgis"
repository = "https://github.com/osgeosuomi/pytest-qgis"
changelog = "https://github.com/osgeosuomi/pytest-qgis/blob/main/CHANGELOG.md"


[tool.uv.build-backend]
module-name = "pytest_qgis"
include = ["py.typed"]

[project.entry-points.pytest11]
pytest_qgis = "pytest_qgis.plugin"


[tool.uv]
default-groups = ["dev", "lint"]

[dependency-groups]
dev = [
  # Testing
  "pytest>=9.1.1",
  "pytest-cov",
  "pytest-qt",
  "pytest-qgis",
  "pytest-xdist",
  # Tools
  "copier",
]
lint = [
  # Linting and formatting (ensure precommit yaml has same versions)
  "prek>=0.5.3",
  "ruff==0.16.8",
  "mypy==2.3.1",
  "flake8==7.4.1",
  # flake8 plugins
  "flake8-qgis==2.1.0",
  "flake8-pyproject==1.2.4",
  "flake8-spellcheck==0.28.0",
  # Stubs for type checks
  "PyQt6-stubs==20250824",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true


[tool.ruff]
target-version = "py312"
line-length = 88

lint.ignore = [
  "FIX",   # flake8-fixme
  "TD002", # Missing author in TODO
  "D100",  # Missing docstring in public module
  "D104",  # Missing docstring in public package
  "D105",  # Missing docstring in magic method
  "D107",  # Missing docstring in `__init__`
  # Conflicting rules (formatter)
  "D203",   # one-blank-line-before-class, D211 used (no-blank-line-before-class)
  "D213",   # multi-line-summary-second-line, D212 used (multi-line-summary-first-line)
  "COM812", # missing-trailing-comma (formatter will enforce this)
  "ISC001", # single-line-implicit-string-concatenation
  "UP037",  # quoted-annotation (quoted annotations are used with TYPE_CHECKING imports)
]

# List of all rules https://docs.astral.sh/ruff/rules/
lint.select = ["ALL"]

lint.unfixable = [
  "F401", # Unused imports
  "F841", # Unused variables
]

# Avoid flagging (and removing) `SC200` from any `# noqa`
# directives, despite Ruff's lack of support for `flake8-spellcheck`.
lint.external = ["SC200", "QGS"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["pytest_qgis"]

[tool.ruff.lint.per-file-ignores]
"{test,test_integration,test_e2e}/*" = [
  "INP001",
  "D",       # pydocstyle
  "DTZ",     # flake8-datetimez
  "FBT",     # flake8-boolean-trap
  "TD",      # flake8-todos
  "S",       # flake8-bandit
  "SLF",     # flake8-self
  "ANN201",  # Missing return type annotation for public function
  "E501",    # Line too long
  "C901",    # Function is too complex
  "PLR2004", # Magic value used in comparison, consider replacing `2000` with a constant variable
  "PLR0912", # Too many branches
  "PLR0913", # Too many arguments in function definition
  "PLR0915", # Too many statements
  "ARG001",  # Unused function argument
]

[tool.flake8]
max-line-length = 88
spellcheck-targets = "names"
dictionaries = "en_US,python,technical"
select = ["SC", "QGS"]
per-file-ignores = [
  "test/*:SC200,QGS",
  "test_integration/*:SC200,QGS",
  "test_e2e/*:SC200,QGS",
]

[tool.mypy]
python_version = "3.12"
follow_imports = "normal"
show_column_numbers = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = [
  # "--qgis_disable_gui" # Runs QGIS tests without GUI
]
markers = [
  "with_pytest_qt: these tests require pytest-qt (deselect with '-m \"with_pytest_qt\"')",
]


[tool.coverage.paths]
source = ["src", "**/site-packages"]

[tool.coverage.run]
branch = true
source_pkgs = ["pytest_qgis"]

[tool.coverage.report]
exclude_also = [
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
